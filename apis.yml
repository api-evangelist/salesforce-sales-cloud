  description: >-
    Push notification API using Bayeux protocol to receive near real-time updates when data changes in
    Salesforce. Enables event-driven integrations without polling.
  humanURL: https://developer.salesforce.com/docs/atlas.en-us.api_streaming.meta/api_streaming/
  baseURL: https://yourInstance.salesforce.com/cometd/59.0
