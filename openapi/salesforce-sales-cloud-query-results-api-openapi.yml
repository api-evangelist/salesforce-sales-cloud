openapi: 3.2.0
info:
  title: Salesforce Sales Cloud Salesforce Bulk API 2.0 Query Results API
  description: Optimized API for loading, updating, or deleting large data sets asynchronously with better performance than REST API. Supports ingest (insert, update, upsert, delete) and query operations on large volumes of records using CSV data format. Designed for ETL workflows and mass data operations.
  version: 59.0.0
  termsOfService: https://www.salesforce.com/company/legal/agreements/
  contact:
    name: Salesforce Developer Support
    url: https://developer.salesforce.com/
  license:
    name: Salesforce Master Subscription Agreement
    url: https://www.salesforce.com/company/legal/agreements/
servers:
- url: https://{instance}.salesforce.com/services/data/v59.0
  description: Salesforce Production or Developer Edition
  variables:
    instance:
      default: yourInstance
      description: Your Salesforce instance identifier
- url: https://{instance}.sandbox.my.salesforce.com/services/data/v59.0
  description: Salesforce Sandbox
  variables:
    instance:
      default: yourInstance
      description: Your Salesforce sandbox instance identifier
security:
- oauth2: []
- bearerAuth: []
tags:
- name: Query Results
  description: Retrieve results from completed query jobs
paths:
  /jobs/query/{jobId}/results:
    get:
      operationId: getQueryJobResults
      summary: Salesforce Sales Cloud Get query job results
      description: Retrieves the results of a completed query job in CSV format. Use the locator and maxRecords parameters to paginate through large result sets.
      tags:
      - Query Results
      parameters:
      - $ref: '#/components/parameters/jobId'
      - name: locator
        in: query
        description: Locator value for retrieving the next set of results
        required: false
        schema:
          type: string
      - name: maxRecords
        in: query
        description: Maximum number of records to return per request
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Successfully retrieved query results
          headers:
            Sforce-Locator:
              description: Locator value for the next set of results (null if no more)
              schema:
                type: string
            Sforce-NumberOfRecords:
              description: Number of records in this result set
              schema:
                type: integer
          content:
            text/csv:
              schema:
                type: string
                description: CSV data of query results
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    NotFound:
      description: The specified job was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed or access token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: array
      items:
        $ref: '#/components/schemas/ApiError'
    ApiError:
      type: object
      properties:
        errorCode:
          type: string
        message:
          type: string
  parameters:
    jobId:
      name: jobId
      in: path
      required: true
      description: The ID of the bulk job
      schema:
        type: string
  securitySchemes:
    oauth2:
      type: oauth2
      description: Salesforce OAuth 2.0 authentication
      flows:
        authorizationCode:
          authorizationUrl: https://login.salesforce.com/services/oauth2/authorize
          tokenUrl: https://login.salesforce.com/services/oauth2/token
          scopes:
            api: Access and manage your Salesforce data
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 Access Token
externalDocs:
  description: Bulk API 2.0 and Bulk API Developer Guide
  url: https://developer.salesforce.com/docs/atlas.en-us.api_asynch.meta/api_asynch/asynch_api_intro.htm
