openapi: 3.2.0
info:
  title: Salesforce Sales Cloud Salesforce Connect REST Communities API
  description: Integrate mobile apps, intranet sites, and third-party web applications with Salesforce. Provides access to Chatter feeds, groups, users, files, and collaboration features. Responses are localized, structured for presentation, and can be filtered to contain only what the app needs.
  version: 59.0.0
  termsOfService: https://www.salesforce.com/company/legal/agreements/
  contact:
    name: Salesforce Developer Support
    url: https://developer.salesforce.com/
  license:
    name: Salesforce Master Subscription Agreement
    url: https://www.salesforce.com/company/legal/agreements/
servers:
- url: https://{instance}.salesforce.com/services/data/v59.0/connect
  description: Salesforce Production or Developer Edition
  variables:
    instance:
      default: yourInstance
      description: Your Salesforce instance identifier
security:
- oauth2: []
- bearerAuth: []
tags:
- name: Communities
  description: Community (Experience Cloud) operations
paths:
  /communities:
    get:
      operationId: listCommunities
      summary: Salesforce Sales Cloud List communities
      description: Returns a list of communities (Experience Cloud sites) available to the current user. Includes community name, URL, status, and description.
      tags:
      - Communities
      responses:
        '200':
          description: Successfully retrieved communities
          content:
            application/json:
              schema:
                type: object
                properties:
                  communities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Community'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    Community:
      type: object
      properties:
        allowChatterAccessWithoutLogin:
          type: boolean
        allowMembersToFlag:
          type: boolean
        description:
          type: string
          nullable: true
        id:
          type: string
        invitationsEnabled:
          type: boolean
        knowledgeableEnabled:
          type: boolean
        loginUrl:
          type: string
        name:
          type: string
        nicknameDisplayEnabled:
          type: boolean
        privateMessagesEnabled:
          type: boolean
        reputationEnabled:
          type: boolean
        sendWelcomeEmail:
          type: boolean
        siteAsContainerEnabled:
          type: boolean
        siteUrl:
          type: string
        status:
          type: string
          enum:
          - Live
          - Inactive
          - UnderConstruction
        url:
          type: string
        urlPathPrefix:
          type: string
    ApiError:
      type: object
      properties:
        errorCode:
          type: string
        message:
          type: string
    ErrorResponse:
      type: array
      items:
        $ref: '#/components/schemas/ApiError'
  responses:
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    oauth2:
      type: oauth2
      description: Salesforce OAuth 2.0 authentication
      flows:
        authorizationCode:
          authorizationUrl: https://login.salesforce.com/services/oauth2/authorize
          tokenUrl: https://login.salesforce.com/services/oauth2/token
          scopes:
            api: Access and manage your Salesforce data
            chatter_api: Access Chatter data
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 Access Token
externalDocs:
  description: Connect REST API Developer Guide
  url: https://developer.salesforce.com/docs/atlas.en-us.chatterapi.meta/chatterapi/intro_what_is_chatter_connect.htm
