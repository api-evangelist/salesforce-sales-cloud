openapi: 3.2.0
info:
  title: Salesforce Sales Cloud Salesforce User Interface Picklist Values API
  description: Build custom user interfaces for Salesforce data using the same API that powers Lightning Experience. Returns data and metadata in a single response with layout, picklist, and field-level security awareness. Provides record CRUD operations, layout metadata, picklist values, and object information optimized for UI rendering.
  version: 59.0.0
  termsOfService: https://www.salesforce.com/company/legal/agreements/
  contact:
    name: Salesforce Developer Support
    url: https://developer.salesforce.com/
  license:
    name: Salesforce Master Subscription Agreement
    url: https://www.salesforce.com/company/legal/agreements/
servers:
- url: https://{instance}.salesforce.com/services/data/v59.0/ui-api
  description: Salesforce Production or Developer Edition
  variables:
    instance:
      default: yourInstance
      description: Your Salesforce instance identifier
security:
- oauth2: []
- bearerAuth: []
tags:
- name: Picklist Values
  description: Picklist field values with record type awareness
paths:
  /object-info/{objectApiName}/picklist-values/{recordTypeId}:
    get:
      operationId: getPicklistValues
      summary: Salesforce Sales Cloud Get picklist values for all fields
      description: Returns the picklist values for all picklist fields on the specified object, filtered by record type. Includes dependent picklist controlling field information.
      tags:
      - Picklist Values
      parameters:
      - name: objectApiName
        in: path
        required: true
        schema:
          type: string
      - name: recordTypeId
        in: path
        required: true
        description: The record type ID (use 012000000000000AAA for master)
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved picklist values
          content:
            application/json:
              schema:
                type: object
                properties:
                  picklistFieldValues:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        controllerValues:
                          type: object
                          additionalProperties:
                            type: integer
                        defaultValue:
                          nullable: true
                        url:
                          type: string
                        values:
                          type: array
                          items:
                            $ref: '#/components/schemas/PicklistValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /object-info/{objectApiName}/picklist-values/{recordTypeId}/{fieldApiName}:
    get:
      operationId: getPicklistValuesByField
      summary: Salesforce Sales Cloud Get picklist values for a specific field
      description: Returns the picklist values for the specified picklist field, filtered by record type.
      tags:
      - Picklist Values
      parameters:
      - name: objectApiName
        in: path
        required: true
        schema:
          type: string
      - name: recordTypeId
        in: path
        required: true
        schema:
          type: string
      - name: fieldApiName
        in: path
        required: true
        description: The API name of the picklist field
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved picklist values
          content:
            application/json:
              schema:
                type: object
                properties:
                  controllerValues:
                    type: object
                  defaultValue:
                    nullable: true
                  url:
                    type: string
                  values:
                    type: array
                    items:
                      $ref: '#/components/schemas/PicklistValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: array
      items:
        $ref: '#/components/schemas/ApiError'
    PicklistValue:
      type: object
      properties:
        attributes:
          type: object
          nullable: true
        label:
          type: string
        validFor:
          type: array
          items:
            type: integer
          description: Indices of controlling field values for which this value is valid
        value:
          type: string
    ApiError:
      type: object
      properties:
        errorCode:
          type: string
        message:
          type: string
  securitySchemes:
    oauth2:
      type: oauth2
      description: Salesforce OAuth 2.0 authentication
      flows:
        authorizationCode:
          authorizationUrl: https://login.salesforce.com/services/oauth2/authorize
          tokenUrl: https://login.salesforce.com/services/oauth2/token
          scopes:
            api: Access and manage your Salesforce data
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 Access Token
externalDocs:
  description: User Interface API Developer Guide
  url: https://developer.salesforce.com/docs/atlas.en-us.uiapi.meta/uiapi/ui_api_get_started.htm
