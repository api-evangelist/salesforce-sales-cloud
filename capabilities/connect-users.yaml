naftiko: 1.0.0-alpha2
info:
  label: Salesforce Sales Cloud Salesforce Connect REST API — Users
  description: 'Salesforce Sales Cloud Salesforce Connect REST API — Users. 2 operations. Lead operation: Salesforce Sales
    Cloud Get current user information. Self-contained Naftiko capability covering one Salesforce Sales Cloud business surface.'
  tags:
  - Salesforce Sales Cloud
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SALES_CLOUD_API_KEY: SALESFORCE_SALES_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: connect-users
    baseUri: https://{instance}.salesforce.com/services/data/v59.0/connect
    description: Salesforce Sales Cloud Salesforce Connect REST API — Users business capability. Self-contained, no shared
      references.
    resources:
    - name: chatter-users-me
      path: /chatter/users/me
      operations:
      - name: getcurrentuser
        method: GET
        description: Salesforce Sales Cloud Get current user information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: chatter-users-userId
      path: /chatter/users/{userId}
      operations:
      - name: getuser
        method: GET
        description: Salesforce Sales Cloud Get user information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: userId
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SALES_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: connect-users-rest
    port: 8080
    description: REST adapter for Salesforce Sales Cloud Salesforce Connect REST API — Users. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/chatter/users/me
      name: chatter-users-me
      description: REST surface for chatter-users-me.
      operations:
      - method: GET
        name: getcurrentuser
        description: Salesforce Sales Cloud Get current user information
        call: connect-users.getcurrentuser
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/chatter/users/{userid}
      name: chatter-users-userid
      description: REST surface for chatter-users-userId.
      operations:
      - method: GET
        name: getuser
        description: Salesforce Sales Cloud Get user information
        call: connect-users.getuser
        with:
          userId: rest.userId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connect-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Sales Cloud Salesforce Connect REST API — Users. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: salesforce-sales-cloud-get-current
      description: Salesforce Sales Cloud Get current user information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: connect-users.getcurrentuser
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sales-cloud-get-user
      description: Salesforce Sales Cloud Get user information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: connect-users.getuser
      with:
        userId: tools.userId
      outputParameters:
      - type: object
        mapping: $.
