naftiko: 1.0.0-alpha2
info:
  label: Salesforce Sales Cloud Salesforce Bulk API 2.0 — Query Jobs
  description: 'Salesforce Sales Cloud Salesforce Bulk API 2.0 — Query Jobs. 5 operations. Lead operation: Salesforce Sales
    Cloud List all query jobs. Self-contained Naftiko capability covering one Salesforce Sales Cloud business surface.'
  tags:
  - Salesforce Sales Cloud
  - Query Jobs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SALES_CLOUD_API_KEY: SALESFORCE_SALES_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: bulk-query-jobs
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Sales Cloud Salesforce Bulk API 2.0 — Query Jobs business capability. Self-contained, no shared
      references.
    resources:
    - name: jobs-query
      path: /jobs/query
      operations:
      - name: listqueryjobs
        method: GET
        description: Salesforce Sales Cloud List all query jobs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: isPkChunkingEnabled
          in: query
          type: boolean
          description: Filter by PK Chunking enabled status
        - name: jobType
          in: query
          type: string
          description: Filter by job type
        - name: queryLocator
          in: query
          type: string
          description: Query locator for paginating through results
      - name: createqueryjob
        method: POST
        description: Salesforce Sales Cloud Create a query job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: jobs-query-jobId
      path: /jobs/query/{jobId}
      operations:
      - name: getqueryjobinfo
        method: GET
        description: Salesforce Sales Cloud Get query job information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: abortqueryjob
        method: PATCH
        description: Salesforce Sales Cloud Abort a query job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletequeryjob
        method: DELETE
        description: Salesforce Sales Cloud Delete a query job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SALES_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: bulk-query-jobs-rest
    port: 8080
    description: REST adapter for Salesforce Sales Cloud Salesforce Bulk API 2.0 — Query Jobs. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/jobs/query
      name: jobs-query
      description: REST surface for jobs-query.
      operations:
      - method: GET
        name: listqueryjobs
        description: Salesforce Sales Cloud List all query jobs
        call: bulk-query-jobs.listqueryjobs
        with:
          isPkChunkingEnabled: rest.isPkChunkingEnabled
          jobType: rest.jobType
          queryLocator: rest.queryLocator
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createqueryjob
        description: Salesforce Sales Cloud Create a query job
        call: bulk-query-jobs.createqueryjob
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/jobs/query/{jobid}
      name: jobs-query-jobid
      description: REST surface for jobs-query-jobId.
      operations:
      - method: GET
        name: getqueryjobinfo
        description: Salesforce Sales Cloud Get query job information
        call: bulk-query-jobs.getqueryjobinfo
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: abortqueryjob
        description: Salesforce Sales Cloud Abort a query job
        call: bulk-query-jobs.abortqueryjob
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletequeryjob
        description: Salesforce Sales Cloud Delete a query job
        call: bulk-query-jobs.deletequeryjob
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: bulk-query-jobs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Sales Cloud Salesforce Bulk API 2.0 — Query Jobs. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: salesforce-sales-cloud-list-all
      description: Salesforce Sales Cloud List all query jobs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bulk-query-jobs.listqueryjobs
      with:
        isPkChunkingEnabled: tools.isPkChunkingEnabled
        jobType: tools.jobType
        queryLocator: tools.queryLocator
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sales-cloud-create-query
      description: Salesforce Sales Cloud Create a query job
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: bulk-query-jobs.createqueryjob
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sales-cloud-get-query
      description: Salesforce Sales Cloud Get query job information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bulk-query-jobs.getqueryjobinfo
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sales-cloud-abort-query
      description: Salesforce Sales Cloud Abort a query job
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: bulk-query-jobs.abortqueryjob
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sales-cloud-delete-query
      description: Salesforce Sales Cloud Delete a query job
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: bulk-query-jobs.deletequeryjob
      outputParameters:
      - type: object
        mapping: $.
