naftiko: 1.0.0-alpha2
info:
  label: Salesforce Sales Cloud Salesforce GraphQL API — GraphQL
  description: 'Salesforce Sales Cloud Salesforce GraphQL API — GraphQL. 1 operations. Lead operation: Salesforce Sales Cloud
    Execute a GraphQL query or mutation. Self-contained Naftiko capability covering one Salesforce Sales Cloud business surface.'
  tags:
  - Salesforce Sales Cloud
  - GraphQL
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SALES_CLOUD_API_KEY: SALESFORCE_SALES_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: graphql-graphql
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Sales Cloud Salesforce GraphQL API — GraphQL business capability. Self-contained, no shared references.
    resources:
    - name: graphql
      path: /graphql
      operations:
      - name: executegraphqlquery
        method: POST
        description: Salesforce Sales Cloud Execute a GraphQL query or mutation
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SALES_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: graphql-graphql-rest
    port: 8080
    description: REST adapter for Salesforce Sales Cloud Salesforce GraphQL API — GraphQL. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/graphql
      name: graphql
      description: REST surface for graphql.
      operations:
      - method: POST
        name: executegraphqlquery
        description: Salesforce Sales Cloud Execute a GraphQL query or mutation
        call: graphql-graphql.executegraphqlquery
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: graphql-graphql-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Sales Cloud Salesforce GraphQL API — GraphQL. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: salesforce-sales-cloud-execute-graphql
      description: Salesforce Sales Cloud Execute a GraphQL query or mutation
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: graphql-graphql.executegraphqlquery
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
