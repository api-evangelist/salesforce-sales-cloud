naftiko: 1.0.0-alpha2
info:
  label: Salesforce Sales Cloud Salesforce Bulk API 2.0 — Ingest Jobs
  description: 'Salesforce Sales Cloud Salesforce Bulk API 2.0 — Ingest Jobs. 5 operations. Lead operation: Salesforce Sales
    Cloud List all ingest jobs. Self-contained Naftiko capability covering one Salesforce Sales Cloud business surface.'
  tags:
  - Salesforce Sales Cloud
  - Ingest Jobs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SALES_CLOUD_API_KEY: SALESFORCE_SALES_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: bulk-ingest-jobs
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Sales Cloud Salesforce Bulk API 2.0 — Ingest Jobs business capability. Self-contained, no shared
      references.
    resources:
    - name: jobs-ingest
      path: /jobs/ingest
      operations:
      - name: listingestjobs
        method: GET
        description: Salesforce Sales Cloud List all ingest jobs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: isPkChunkingEnabled
          in: query
          type: boolean
          description: Filter by PK Chunking enabled status
        - name: jobType
          in: query
          type: string
          description: Filter by job type
        - name: concurrencyMode
          in: query
          type: string
          description: Filter by concurrency mode
        - name: queryLocator
          in: query
          type: string
          description: Query locator for paginating through results
      - name: createingestjob
        method: POST
        description: Salesforce Sales Cloud Create an ingest job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: jobs-ingest-jobId
      path: /jobs/ingest/{jobId}
      operations:
      - name: getingestjobinfo
        method: GET
        description: Salesforce Sales Cloud Get ingest job information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateingestjobstate
        method: PATCH
        description: Salesforce Sales Cloud Close, abort, or delete an ingest job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteingestjob
        method: DELETE
        description: Salesforce Sales Cloud Delete an ingest job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SALES_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: bulk-ingest-jobs-rest
    port: 8080
    description: REST adapter for Salesforce Sales Cloud Salesforce Bulk API 2.0 — Ingest Jobs. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/jobs/ingest
      name: jobs-ingest
      description: REST surface for jobs-ingest.
      operations:
      - method: GET
        name: listingestjobs
        description: Salesforce Sales Cloud List all ingest jobs
        call: bulk-ingest-jobs.listingestjobs
        with:
          isPkChunkingEnabled: rest.isPkChunkingEnabled
          jobType: rest.jobType
          concurrencyMode: rest.concurrencyMode
          queryLocator: rest.queryLocator
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createingestjob
        description: Salesforce Sales Cloud Create an ingest job
        call: bulk-ingest-jobs.createingestjob
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/jobs/ingest/{jobid}
      name: jobs-ingest-jobid
      description: REST surface for jobs-ingest-jobId.
      operations:
      - method: GET
        name: getingestjobinfo
        description: Salesforce Sales Cloud Get ingest job information
        call: bulk-ingest-jobs.getingestjobinfo
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateingestjobstate
        description: Salesforce Sales Cloud Close, abort, or delete an ingest job
        call: bulk-ingest-jobs.updateingestjobstate
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteingestjob
        description: Salesforce Sales Cloud Delete an ingest job
        call: bulk-ingest-jobs.deleteingestjob
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: bulk-ingest-jobs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Sales Cloud Salesforce Bulk API 2.0 — Ingest Jobs. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: salesforce-sales-cloud-list-all
      description: Salesforce Sales Cloud List all ingest jobs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bulk-ingest-jobs.listingestjobs
      with:
        isPkChunkingEnabled: tools.isPkChunkingEnabled
        jobType: tools.jobType
        concurrencyMode: tools.concurrencyMode
        queryLocator: tools.queryLocator
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sales-cloud-create-ingest
      description: Salesforce Sales Cloud Create an ingest job
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: bulk-ingest-jobs.createingestjob
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sales-cloud-get-ingest
      description: Salesforce Sales Cloud Get ingest job information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bulk-ingest-jobs.getingestjobinfo
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sales-cloud-close-abort
      description: Salesforce Sales Cloud Close, abort, or delete an ingest job
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: bulk-ingest-jobs.updateingestjobstate
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sales-cloud-delete-ingest
      description: Salesforce Sales Cloud Delete an ingest job
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: bulk-ingest-jobs.deleteingestjob
      outputParameters:
      - type: object
        mapping: $.
