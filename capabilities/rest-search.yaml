naftiko: 1.0.0-alpha2
info:
  label: Salesforce Sales Cloud Salesforce REST API — Search
  description: 'Salesforce Sales Cloud Salesforce REST API — Search. 1 operations. Lead operation: Salesforce Sales Cloud
    Execute a SOSL search. Self-contained Naftiko capability covering one Salesforce Sales Cloud business surface.'
  tags:
  - Salesforce Sales Cloud
  - Search
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SALES_CLOUD_API_KEY: SALESFORCE_SALES_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-search
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Sales Cloud Salesforce REST API — Search business capability. Self-contained, no shared references.
    resources:
    - name: search
      path: /search
      operations:
      - name: executesoslsearch
        method: GET
        description: Salesforce Sales Cloud Execute a SOSL search
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: q
          in: query
          type: string
          description: The SOSL search string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SALES_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-search-rest
    port: 8080
    description: REST adapter for Salesforce Sales Cloud Salesforce REST API — Search. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/search
      name: search
      description: REST surface for search.
      operations:
      - method: GET
        name: executesoslsearch
        description: Salesforce Sales Cloud Execute a SOSL search
        call: rest-search.executesoslsearch
        with:
          q: rest.q
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-search-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Sales Cloud Salesforce REST API — Search. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: salesforce-sales-cloud-execute-sosl
      description: Salesforce Sales Cloud Execute a SOSL search
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-search.executesoslsearch
      with:
        q: tools.q
      outputParameters:
      - type: object
        mapping: $.
