naftiko: 1.0.0-alpha2
info:
  label: Salesforce Sales Cloud Salesforce Connect REST API — Communities
  description: 'Salesforce Sales Cloud Salesforce Connect REST API — Communities. 1 operations. Lead operation: Salesforce
    Sales Cloud List communities. Self-contained Naftiko capability covering one Salesforce Sales Cloud business surface.'
  tags:
  - Salesforce Sales Cloud
  - Communities
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SALES_CLOUD_API_KEY: SALESFORCE_SALES_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: connect-communities
    baseUri: https://{instance}.salesforce.com/services/data/v59.0/connect
    description: Salesforce Sales Cloud Salesforce Connect REST API — Communities business capability. Self-contained, no
      shared references.
    resources:
    - name: communities
      path: /communities
      operations:
      - name: listcommunities
        method: GET
        description: Salesforce Sales Cloud List communities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SALES_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: connect-communities-rest
    port: 8080
    description: REST adapter for Salesforce Sales Cloud Salesforce Connect REST API — Communities. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/communities
      name: communities
      description: REST surface for communities.
      operations:
      - method: GET
        name: listcommunities
        description: Salesforce Sales Cloud List communities
        call: connect-communities.listcommunities
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connect-communities-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Sales Cloud Salesforce Connect REST API — Communities. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: salesforce-sales-cloud-list-communities
      description: Salesforce Sales Cloud List communities
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: connect-communities.listcommunities
      outputParameters:
      - type: object
        mapping: $.
