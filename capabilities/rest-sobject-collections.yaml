naftiko: 1.0.0-alpha2
info:
  label: Salesforce Sales Cloud Salesforce REST API — SObject Collections
  description: 'Salesforce Sales Cloud Salesforce REST API — SObject Collections. 3 operations. Lead operation: Salesforce
    Sales Cloud Create multiple sObject records. Self-contained Naftiko capability covering one Salesforce Sales Cloud business
    surface.'
  tags:
  - Salesforce Sales Cloud
  - SObject Collections
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SALES_CLOUD_API_KEY: SALESFORCE_SALES_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-sobject-collections
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Sales Cloud Salesforce REST API — SObject Collections business capability. Self-contained, no
      shared references.
    resources:
    - name: composite-sobjects
      path: /composite/sobjects
      operations:
      - name: createsobjectcollection
        method: POST
        description: Salesforce Sales Cloud Create multiple sObject records
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: allOrNone
          in: query
          type: boolean
          description: If true, all records must succeed or all fail
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: updatesobjectcollection
        method: PATCH
        description: Salesforce Sales Cloud Update multiple sObject records
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: allOrNone
          in: query
          type: boolean
          description: If true, all records must succeed or all fail
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletesobjectcollection
        method: DELETE
        description: Salesforce Sales Cloud Delete multiple sObject records
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ids
          in: query
          type: string
          description: Comma-separated list of record IDs to delete
          required: true
        - name: allOrNone
          in: query
          type: boolean
          description: If true, all records must succeed or all fail
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SALES_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-sobject-collections-rest
    port: 8080
    description: REST adapter for Salesforce Sales Cloud Salesforce REST API — SObject Collections. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/composite/sobjects
      name: composite-sobjects
      description: REST surface for composite-sobjects.
      operations:
      - method: POST
        name: createsobjectcollection
        description: Salesforce Sales Cloud Create multiple sObject records
        call: rest-sobject-collections.createsobjectcollection
        with:
          allOrNone: rest.allOrNone
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatesobjectcollection
        description: Salesforce Sales Cloud Update multiple sObject records
        call: rest-sobject-collections.updatesobjectcollection
        with:
          allOrNone: rest.allOrNone
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletesobjectcollection
        description: Salesforce Sales Cloud Delete multiple sObject records
        call: rest-sobject-collections.deletesobjectcollection
        with:
          ids: rest.ids
          allOrNone: rest.allOrNone
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-sobject-collections-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Sales Cloud Salesforce REST API — SObject Collections. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: salesforce-sales-cloud-create-multiple
      description: Salesforce Sales Cloud Create multiple sObject records
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-sobject-collections.createsobjectcollection
      with:
        allOrNone: tools.allOrNone
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sales-cloud-update-multiple
      description: Salesforce Sales Cloud Update multiple sObject records
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: rest-sobject-collections.updatesobjectcollection
      with:
        allOrNone: tools.allOrNone
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sales-cloud-delete-multiple
      description: Salesforce Sales Cloud Delete multiple sObject records
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: rest-sobject-collections.deletesobjectcollection
      with:
        ids: tools.ids
        allOrNone: tools.allOrNone
      outputParameters:
      - type: object
        mapping: $.
