naftiko: 1.0.0-alpha2
info:
  label: Salesforce Sales Cloud Salesforce REST API — Tabs
  description: 'Salesforce Sales Cloud Salesforce REST API — Tabs. 1 operations. Lead operation: Salesforce Sales Cloud Get
    available tabs. Self-contained Naftiko capability covering one Salesforce Sales Cloud business surface.'
  tags:
  - Salesforce Sales Cloud
  - Tabs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SALES_CLOUD_API_KEY: SALESFORCE_SALES_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-tabs
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Sales Cloud Salesforce REST API — Tabs business capability. Self-contained, no shared references.
    resources:
    - name: tabs
      path: /tabs
      operations:
      - name: gettabs
        method: GET
        description: Salesforce Sales Cloud Get available tabs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SALES_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-tabs-rest
    port: 8080
    description: REST adapter for Salesforce Sales Cloud Salesforce REST API — Tabs. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/tabs
      name: tabs
      description: REST surface for tabs.
      operations:
      - method: GET
        name: gettabs
        description: Salesforce Sales Cloud Get available tabs
        call: rest-tabs.gettabs
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-tabs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Sales Cloud Salesforce REST API — Tabs. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: salesforce-sales-cloud-get-available
      description: Salesforce Sales Cloud Get available tabs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-tabs.gettabs
      outputParameters:
      - type: object
        mapping: $.
