naftiko: 1.0.0-alpha2
info:
  label: Salesforce Sales Cloud Salesforce REST API — SObject
  description: 'Salesforce Sales Cloud Salesforce REST API — SObject. 2 operations. Lead operation: Salesforce Sales Cloud
    List available sObjects. Self-contained Naftiko capability covering one Salesforce Sales Cloud business surface.'
  tags:
  - Salesforce Sales Cloud
  - SObject
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SALES_CLOUD_API_KEY: SALESFORCE_SALES_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-sobject
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Sales Cloud Salesforce REST API — SObject business capability. Self-contained, no shared references.
    resources:
    - name: sobjects
      path: /sobjects
      operations:
      - name: listsobjects
        method: GET
        description: Salesforce Sales Cloud List available sObjects
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: sobjects-sObjectName
      path: /sobjects/{sObjectName}
      operations:
      - name: getsobjectbasicinfo
        method: GET
        description: Salesforce Sales Cloud Get sObject basic information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SALES_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-sobject-rest
    port: 8080
    description: REST adapter for Salesforce Sales Cloud Salesforce REST API — SObject. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/sobjects
      name: sobjects
      description: REST surface for sobjects.
      operations:
      - method: GET
        name: listsobjects
        description: Salesforce Sales Cloud List available sObjects
        call: rest-sobject.listsobjects
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sobjects/{sobjectname}
      name: sobjects-sobjectname
      description: REST surface for sobjects-sObjectName.
      operations:
      - method: GET
        name: getsobjectbasicinfo
        description: Salesforce Sales Cloud Get sObject basic information
        call: rest-sobject.getsobjectbasicinfo
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-sobject-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Sales Cloud Salesforce REST API — SObject. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: salesforce-sales-cloud-list-available
      description: Salesforce Sales Cloud List available sObjects
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-sobject.listsobjects
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sales-cloud-get-sobject
      description: Salesforce Sales Cloud Get sObject basic information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-sobject.getsobjectbasicinfo
      outputParameters:
      - type: object
        mapping: $.
