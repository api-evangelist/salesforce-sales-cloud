naftiko: 1.0.0-alpha2
info:
  label: Salesforce Sales Cloud Salesforce User Interface API — Picklist Values
  description: 'Salesforce Sales Cloud Salesforce User Interface API — Picklist Values. 2 operations. Lead operation: Salesforce
    Sales Cloud Get picklist values for all fields. Self-contained Naftiko capability covering one Salesforce Sales Cloud
    business surface.'
  tags:
  - Salesforce Sales Cloud
  - Picklist Values
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SALES_CLOUD_API_KEY: SALESFORCE_SALES_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: ui-picklist-values
    baseUri: https://{instance}.salesforce.com/services/data/v59.0/ui-api
    description: Salesforce Sales Cloud Salesforce User Interface API — Picklist Values business capability. Self-contained,
      no shared references.
    resources:
    - name: object-info-objectApiName-picklist-values-recordTypeId
      path: /object-info/{objectApiName}/picklist-values/{recordTypeId}
      operations:
      - name: getpicklistvalues
        method: GET
        description: Salesforce Sales Cloud Get picklist values for all fields
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: objectApiName
          in: path
          type: string
          required: true
        - name: recordTypeId
          in: path
          type: string
          description: The record type ID (use 012000000000000AAA for master)
          required: true
    - name: object-info-objectApiName-picklist-values-recordTypeId-fieldApiName
      path: /object-info/{objectApiName}/picklist-values/{recordTypeId}/{fieldApiName}
      operations:
      - name: getpicklistvaluesbyfield
        method: GET
        description: Salesforce Sales Cloud Get picklist values for a specific field
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: objectApiName
          in: path
          type: string
          required: true
        - name: recordTypeId
          in: path
          type: string
          required: true
        - name: fieldApiName
          in: path
          type: string
          description: The API name of the picklist field
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SALES_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: ui-picklist-values-rest
    port: 8080
    description: REST adapter for Salesforce Sales Cloud Salesforce User Interface API — Picklist Values. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/object-info/{objectapiname}/picklist-values/{recordtypeid}
      name: object-info-objectapiname-picklist-values-recordtypeid
      description: REST surface for object-info-objectApiName-picklist-values-recordTypeId.
      operations:
      - method: GET
        name: getpicklistvalues
        description: Salesforce Sales Cloud Get picklist values for all fields
        call: ui-picklist-values.getpicklistvalues
        with:
          objectApiName: rest.objectApiName
          recordTypeId: rest.recordTypeId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/object-info/{objectapiname}/picklist-values/{recordtypeid}/{fieldapiname}
      name: object-info-objectapiname-picklist-values-recordtypeid-fieldapiname
      description: REST surface for object-info-objectApiName-picklist-values-recordTypeId-fieldApiName.
      operations:
      - method: GET
        name: getpicklistvaluesbyfield
        description: Salesforce Sales Cloud Get picklist values for a specific field
        call: ui-picklist-values.getpicklistvaluesbyfield
        with:
          objectApiName: rest.objectApiName
          recordTypeId: rest.recordTypeId
          fieldApiName: rest.fieldApiName
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ui-picklist-values-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Sales Cloud Salesforce User Interface API — Picklist Values. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: salesforce-sales-cloud-get-picklist
      description: Salesforce Sales Cloud Get picklist values for all fields
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ui-picklist-values.getpicklistvalues
      with:
        objectApiName: tools.objectApiName
        recordTypeId: tools.recordTypeId
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sales-cloud-get-picklist-2
      description: Salesforce Sales Cloud Get picklist values for a specific field
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ui-picklist-values.getpicklistvaluesbyfield
      with:
        objectApiName: tools.objectApiName
        recordTypeId: tools.recordTypeId
        fieldApiName: tools.fieldApiName
      outputParameters:
      - type: object
        mapping: $.
