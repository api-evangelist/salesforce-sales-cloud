naftiko: 1.0.0-alpha2
info:
  label: Salesforce Sales Cloud Salesforce User Interface API — List Views
  description: 'Salesforce Sales Cloud Salesforce User Interface API — List Views. 1 operations. Lead operation: Salesforce
    Sales Cloud Get list view records. Self-contained Naftiko capability covering one Salesforce Sales Cloud business surface.'
  tags:
  - Salesforce Sales Cloud
  - List Views
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SALES_CLOUD_API_KEY: SALESFORCE_SALES_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: ui-list-views
    baseUri: https://{instance}.salesforce.com/services/data/v59.0/ui-api
    description: Salesforce Sales Cloud Salesforce User Interface API — List Views business capability. Self-contained, no
      shared references.
    resources:
    - name: list-ui-listViewId
      path: /list-ui/{listViewId}
      operations:
      - name: getlistviewrecords
        method: GET
        description: Salesforce Sales Cloud Get list view records
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: listViewId
          in: path
          type: string
          required: true
        - name: pageSize
          in: query
          type: integer
        - name: pageToken
          in: query
          type: string
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SALES_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: ui-list-views-rest
    port: 8080
    description: REST adapter for Salesforce Sales Cloud Salesforce User Interface API — List Views. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/list-ui/{listviewid}
      name: list-ui-listviewid
      description: REST surface for list-ui-listViewId.
      operations:
      - method: GET
        name: getlistviewrecords
        description: Salesforce Sales Cloud Get list view records
        call: ui-list-views.getlistviewrecords
        with:
          listViewId: rest.listViewId
          pageSize: rest.pageSize
          pageToken: rest.pageToken
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ui-list-views-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Sales Cloud Salesforce User Interface API — List Views. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: salesforce-sales-cloud-get-list
      description: Salesforce Sales Cloud Get list view records
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ui-list-views.getlistviewrecords
      with:
        listViewId: tools.listViewId
        pageSize: tools.pageSize
        pageToken: tools.pageToken
      outputParameters:
      - type: object
        mapping: $.
