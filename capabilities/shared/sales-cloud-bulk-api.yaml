naftiko: "1.0.0-alpha1"

info:
  label: "Salesforce Bulk API 2.0"
  description: "API for loading, updating, or deleting large datasets asynchronously with high performance."
  tags:
    - Salesforce
    - Sales Cloud
    - Bulk
    - ETL
    - Data Loading
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SALESFORCE_ACCESS_TOKEN: SALESFORCE_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: salesforce-bulk
      baseUri: https://{instance}.salesforce.com/services/data/v59.0
      description: "Salesforce Bulk API 2.0"
      authentication:
        type: bearer
        token: "{{SALESFORCE_ACCESS_TOKEN}}"
      resources:
        - name: ingest-jobs
          path: /jobs/ingest
          description: "Bulk ingest job management"
          operations:
            - name: list-ingest-jobs
              method: GET
              description: "List all bulk ingest jobs"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-ingest-job
              method: POST
              description: "Create a new bulk ingest job"
              body:
                type: json
                data:
                  object: "{{tools.object}}"
                  contentType: "{{tools.contentType}}"
                  operation: "{{tools.operation}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: ingest-job
          path: /jobs/ingest/{jobId}
          description: "Individual ingest job operations"
          operations:
            - name: get-ingest-job
              method: GET
              description: "Get status of a bulk ingest job"
              inputParameters:
                - name: jobId
                  in: path
                  type: string
                  required: true
                  description: "Bulk job ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: close-ingest-job
              method: PATCH
              description: "Close or abort a bulk ingest job"
              inputParameters:
                - name: jobId
                  in: path
                  type: string
                  required: true
                  description: "Bulk job ID"
              body:
                type: json
                data:
                  state: "{{tools.state}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: query-jobs
          path: /jobs/query
          description: "Bulk query job management"
          operations:
            - name: list-query-jobs
              method: GET
              description: "List all bulk query jobs"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-query-job
              method: POST
              description: "Create a bulk query job"
              body:
                type: json
                data:
                  operation: "{{tools.operation}}"
                  query: "{{tools.query}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8102
      namespace: sales-cloud-bulk-rest
      resources:
        - path: /v1/bulk/ingest-jobs
          name: ingest-jobs
          operations:
            - method: GET
              name: list-ingest-jobs
              description: "List bulk ingest jobs"
              call: "salesforce-bulk.list-ingest-jobs"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-ingest-job
              description: "Create a bulk ingest job"
              call: "salesforce-bulk.create-ingest-job"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9102
      namespace: sales-cloud-bulk-mcp
      transport: http
      tools:
        - name: list-ingest-jobs
          description: "List bulk ingest jobs and their statuses"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-bulk.list-ingest-jobs"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-ingest-job
          description: "Create a new bulk data ingest job"
          hints:
            readOnly: false
            destructive: false
          call: "salesforce-bulk.create-ingest-job"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-ingest-job
          description: "Get status and results of a bulk ingest job"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-bulk.get-ingest-job"
          with:
            jobId: "tools.jobId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: close-ingest-job
          description: "Close or abort a bulk ingest job"
          hints:
            readOnly: false
            idempotent: true
          call: "salesforce-bulk.close-ingest-job"
          with:
            jobId: "tools.jobId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-query-job
          description: "Create a bulk query job to extract large datasets"
          hints:
            readOnly: false
            destructive: false
          call: "salesforce-bulk.create-query-job"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-query-jobs
          description: "List bulk query jobs"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-bulk.list-query-jobs"
          outputParameters:
            - type: object
              mapping: "$."
