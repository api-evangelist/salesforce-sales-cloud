naftiko: "1.0.0-alpha1"

info:
  label: "Salesforce Sales Cloud REST API"
  description: "Primary REST API for accessing Salesforce Sales Cloud data including accounts, contacts, leads, opportunities, and custom objects. Supports CRUD operations, SOQL/SOSL queries, and org metadata."
  tags:
    - Salesforce
    - Sales Cloud
    - CRM
    - REST
    - Records
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SALESFORCE_ACCESS_TOKEN: SALESFORCE_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: salesforce-sales-rest
      baseUri: https://{instance}.salesforce.com/services/data/v59.0
      description: "Salesforce Sales Cloud REST API"
      authentication:
        type: bearer
        token: "{{SALESFORCE_ACCESS_TOKEN}}"
      resources:
        - name: limits
          path: /limits
          description: "Org API limits"
          operations:
            - name: get-org-limits
              method: GET
              description: "Get API limits and usage information"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: sobjects
          path: /sobjects
          description: "List sObject types"
          operations:
            - name: list-sobjects
              method: GET
              description: "List all sObject types in the org"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: sobject-describe
          path: /sobjects/{sObjectName}/describe
          description: "sObject metadata"
          operations:
            - name: describe-sobject
              method: GET
              description: "Get metadata description of a sObject type"
              inputParameters:
                - name: sObjectName
                  in: path
                  type: string
                  required: true
                  description: "API name of the sObject"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: sobject-records
          path: /sobjects/{sObjectName}
          description: "sObject record operations"
          operations:
            - name: create-sobject-record
              method: POST
              description: "Create a new sObject record"
              inputParameters:
                - name: sObjectName
                  in: path
                  type: string
                  required: true
                  description: "API name of the sObject"
              body:
                type: json
                data:
                  fields: "{{tools.fields}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: sobject-row
          path: /sobjects/{sObjectName}/{id}
          description: "Individual sObject record operations"
          operations:
            - name: get-sobject-record
              method: GET
              description: "Get a specific sObject record by ID"
              inputParameters:
                - name: sObjectName
                  in: path
                  type: string
                  required: true
                  description: "API name of the sObject"
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Salesforce record ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-sobject-record
              method: PATCH
              description: "Update a sObject record"
              inputParameters:
                - name: sObjectName
                  in: path
                  type: string
                  required: true
                  description: "API name of the sObject"
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Salesforce record ID"
              body:
                type: json
                data:
                  fields: "{{tools.fields}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-sobject-record
              method: DELETE
              description: "Delete a sObject record"
              inputParameters:
                - name: sObjectName
                  in: path
                  type: string
                  required: true
                  description: "API name of the sObject"
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Salesforce record ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: soql-query
          path: /query
          description: "SOQL query execution"
          operations:
            - name: soql-query
              method: GET
              description: "Execute a SOQL query"
              inputParameters:
                - name: q
                  in: query
                  type: string
                  required: true
                  description: "SOQL query string"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: sosl-search
          path: /search
          description: "SOSL search execution"
          operations:
            - name: sosl-search
              method: GET
              description: "Execute a SOSL search"
              inputParameters:
                - name: q
                  in: query
                  type: string
                  required: true
                  description: "SOSL search string"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: process-approvals
          path: /process/approvals
          description: "Approval process management"
          operations:
            - name: list-approval-items
              method: GET
              description: "List all approval items"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: submit-for-approval
              method: POST
              description: "Submit a record for approval"
              body:
                type: json
                data:
                  requests: "{{tools.requests}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: sales-cloud-rest-api
      resources:
        - path: /v1/records/{sObjectName}
          name: sobject-records
          description: "sObject record CRUD"
          operations:
            - method: GET
              name: list-records
              description: "List sObject records"
              call: "salesforce-sales-rest.list-sobjects"
              with:
                sObjectName: "rest.sObjectName"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-record
              description: "Create a record"
              call: "salesforce-sales-rest.create-sobject-record"
              with:
                sObjectName: "rest.sObjectName"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/records/{sObjectName}/{id}
          name: sobject-record
          description: "Individual record operations"
          operations:
            - method: GET
              name: get-record
              description: "Get a record"
              call: "salesforce-sales-rest.get-sobject-record"
              with:
                sObjectName: "rest.sObjectName"
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/query
          name: soql-query
          description: "SOQL query"
          operations:
            - method: GET
              name: query
              description: "Execute SOQL"
              call: "salesforce-sales-rest.soql-query"
              with:
                q: "rest.q"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: sales-cloud-rest-mcp
      transport: http
      tools:
        - name: get-org-limits
          description: "Get API usage limits for the Salesforce org"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-sales-rest.get-org-limits"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-sobject-types
          description: "List all available sObject types in the org"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-sales-rest.list-sobjects"
          outputParameters:
            - type: object
              mapping: "$."
        - name: describe-sobject
          description: "Get field metadata for a sObject type"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-sales-rest.describe-sobject"
          with:
            sObjectName: "tools.sObjectName"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-record
          description: "Get a Salesforce record by sObject type and ID"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-sales-rest.get-sobject-record"
          with:
            sObjectName: "tools.sObjectName"
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-record
          description: "Create a new Salesforce record"
          hints:
            readOnly: false
            destructive: false
          call: "salesforce-sales-rest.create-sobject-record"
          with:
            sObjectName: "tools.sObjectName"
          outputParameters:
            - type: object
              mapping: "$."
        - name: update-record
          description: "Update an existing Salesforce record"
          hints:
            readOnly: false
            idempotent: true
          call: "salesforce-sales-rest.update-sobject-record"
          with:
            sObjectName: "tools.sObjectName"
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-record
          description: "Delete a Salesforce record"
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "salesforce-sales-rest.delete-sobject-record"
          with:
            sObjectName: "tools.sObjectName"
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: soql-query
          description: "Execute a SOQL query to retrieve Salesforce records"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-sales-rest.soql-query"
          with:
            q: "tools.q"
          outputParameters:
            - type: object
              mapping: "$."
        - name: sosl-search
          description: "Execute a SOSL search across multiple sObjects"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-sales-rest.sosl-search"
          with:
            q: "tools.q"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-approval-items
          description: "List all pending approval items"
          hints:
            readOnly: true
            idempotent: true
          call: "salesforce-sales-rest.list-approval-items"
          outputParameters:
            - type: object
              mapping: "$."
        - name: submit-for-approval
          description: "Submit a record for approval process"
          hints:
            readOnly: false
            destructive: false
          call: "salesforce-sales-rest.submit-for-approval"
          outputParameters:
            - type: object
              mapping: "$."
