naftiko: 1.0.0-alpha2
info:
  label: Salesforce Sales Cloud Salesforce User Interface API — Object Info
  description: 'Salesforce Sales Cloud Salesforce User Interface API — Object Info. 1 operations. Lead operation: Salesforce
    Sales Cloud Get object metadata for UI. Self-contained Naftiko capability covering one Salesforce Sales Cloud business
    surface.'
  tags:
  - Salesforce Sales Cloud
  - Object Info
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SALES_CLOUD_API_KEY: SALESFORCE_SALES_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: ui-object-info
    baseUri: https://{instance}.salesforce.com/services/data/v59.0/ui-api
    description: Salesforce Sales Cloud Salesforce User Interface API — Object Info business capability. Self-contained, no
      shared references.
    resources:
    - name: object-info-objectApiName
      path: /object-info/{objectApiName}
      operations:
      - name: getobjectinfo
        method: GET
        description: Salesforce Sales Cloud Get object metadata for UI
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: objectApiName
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SALES_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: ui-object-info-rest
    port: 8080
    description: REST adapter for Salesforce Sales Cloud Salesforce User Interface API — Object Info. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/object-info/{objectapiname}
      name: object-info-objectapiname
      description: REST surface for object-info-objectApiName.
      operations:
      - method: GET
        name: getobjectinfo
        description: Salesforce Sales Cloud Get object metadata for UI
        call: ui-object-info.getobjectinfo
        with:
          objectApiName: rest.objectApiName
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ui-object-info-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Sales Cloud Salesforce User Interface API — Object Info. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: salesforce-sales-cloud-get-object
      description: Salesforce Sales Cloud Get object metadata for UI
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ui-object-info.getobjectinfo
      with:
        objectApiName: tools.objectApiName
      outputParameters:
      - type: object
        mapping: $.
