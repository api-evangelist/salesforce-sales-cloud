naftiko: 1.0.0-alpha2
info:
  label: Salesforce Sales Cloud Salesforce REST API — Limits
  description: 'Salesforce Sales Cloud Salesforce REST API — Limits. 1 operations. Lead operation: Salesforce Sales Cloud
    Get organization limits. Self-contained Naftiko capability covering one Salesforce Sales Cloud business surface.'
  tags:
  - Salesforce Sales Cloud
  - Limits
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SALES_CLOUD_API_KEY: SALESFORCE_SALES_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-limits
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Sales Cloud Salesforce REST API — Limits business capability. Self-contained, no shared references.
    resources:
    - name: limits
      path: /limits
      operations:
      - name: getorglimits
        method: GET
        description: Salesforce Sales Cloud Get organization limits
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SALES_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-limits-rest
    port: 8080
    description: REST adapter for Salesforce Sales Cloud Salesforce REST API — Limits. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/limits
      name: limits
      description: REST surface for limits.
      operations:
      - method: GET
        name: getorglimits
        description: Salesforce Sales Cloud Get organization limits
        call: rest-limits.getorglimits
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-limits-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Sales Cloud Salesforce REST API — Limits. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: salesforce-sales-cloud-get-organization
      description: Salesforce Sales Cloud Get organization limits
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-limits.getorglimits
      outputParameters:
      - type: object
        mapping: $.
