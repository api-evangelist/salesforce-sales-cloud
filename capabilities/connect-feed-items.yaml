naftiko: 1.0.0-alpha2
info:
  label: Salesforce Sales Cloud Salesforce Connect REST API — Feed Items
  description: 'Salesforce Sales Cloud Salesforce Connect REST API — Feed Items. 5 operations. Lead operation: Salesforce
    Sales Cloud Post a feed element. Self-contained Naftiko capability covering one Salesforce Sales Cloud business surface.'
  tags:
  - Salesforce Sales Cloud
  - Feed Items
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SALES_CLOUD_API_KEY: SALESFORCE_SALES_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: connect-feed-items
    baseUri: https://{instance}.salesforce.com/services/data/v59.0/connect
    description: Salesforce Sales Cloud Salesforce Connect REST API — Feed Items business capability. Self-contained, no shared
      references.
    resources:
    - name: chatter-feed-elements
      path: /chatter/feed-elements
      operations:
      - name: postfeedelement
        method: POST
        description: Salesforce Sales Cloud Post a feed element
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: chatter-feed-elements-feedElementId
      path: /chatter/feed-elements/{feedElementId}
      operations:
      - name: getfeedelement
        method: GET
        description: Salesforce Sales Cloud Get a feed element
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: feedElementId
          in: path
          type: string
          description: The ID of the feed element
          required: true
      - name: deletefeedelement
        method: DELETE
        description: Salesforce Sales Cloud Delete a feed element
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: feedElementId
          in: path
          type: string
          required: true
    - name: chatter-feed-elements-feedElementId-capabilities-comments-items
      path: /chatter/feed-elements/{feedElementId}/capabilities/comments/items
      operations:
      - name: getfeedelementcomments
        method: GET
        description: Salesforce Sales Cloud Get comments on a feed element
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: feedElementId
          in: path
          type: string
          required: true
        - name: pageSize
          in: query
          type: integer
      - name: postcomment
        method: POST
        description: Salesforce Sales Cloud Post a comment on a feed element
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: feedElementId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SALES_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: connect-feed-items-rest
    port: 8080
    description: REST adapter for Salesforce Sales Cloud Salesforce Connect REST API — Feed Items. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/chatter/feed-elements
      name: chatter-feed-elements
      description: REST surface for chatter-feed-elements.
      operations:
      - method: POST
        name: postfeedelement
        description: Salesforce Sales Cloud Post a feed element
        call: connect-feed-items.postfeedelement
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/chatter/feed-elements/{feedelementid}
      name: chatter-feed-elements-feedelementid
      description: REST surface for chatter-feed-elements-feedElementId.
      operations:
      - method: GET
        name: getfeedelement
        description: Salesforce Sales Cloud Get a feed element
        call: connect-feed-items.getfeedelement
        with:
          feedElementId: rest.feedElementId
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletefeedelement
        description: Salesforce Sales Cloud Delete a feed element
        call: connect-feed-items.deletefeedelement
        with:
          feedElementId: rest.feedElementId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/chatter/feed-elements/{feedelementid}/capabilities/comments/items
      name: chatter-feed-elements-feedelementid-capabilities-comments-items
      description: REST surface for chatter-feed-elements-feedElementId-capabilities-comments-items.
      operations:
      - method: GET
        name: getfeedelementcomments
        description: Salesforce Sales Cloud Get comments on a feed element
        call: connect-feed-items.getfeedelementcomments
        with:
          feedElementId: rest.feedElementId
          pageSize: rest.pageSize
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: postcomment
        description: Salesforce Sales Cloud Post a comment on a feed element
        call: connect-feed-items.postcomment
        with:
          feedElementId: rest.feedElementId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connect-feed-items-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Sales Cloud Salesforce Connect REST API — Feed Items. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: salesforce-sales-cloud-post-feed
      description: Salesforce Sales Cloud Post a feed element
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: connect-feed-items.postfeedelement
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sales-cloud-get-feed
      description: Salesforce Sales Cloud Get a feed element
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: connect-feed-items.getfeedelement
      with:
        feedElementId: tools.feedElementId
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sales-cloud-delete-feed
      description: Salesforce Sales Cloud Delete a feed element
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: connect-feed-items.deletefeedelement
      with:
        feedElementId: tools.feedElementId
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sales-cloud-get-comments
      description: Salesforce Sales Cloud Get comments on a feed element
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: connect-feed-items.getfeedelementcomments
      with:
        feedElementId: tools.feedElementId
        pageSize: tools.pageSize
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sales-cloud-post-comment
      description: Salesforce Sales Cloud Post a comment on a feed element
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: connect-feed-items.postcomment
      with:
        feedElementId: tools.feedElementId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
