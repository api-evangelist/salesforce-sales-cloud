naftiko: 1.0.0-alpha2
info:
  label: Salesforce Sales Cloud Salesforce Tooling API — Execute Anonymous
  description: 'Salesforce Sales Cloud Salesforce Tooling API — Execute Anonymous. 1 operations. Lead operation: Salesforce
    Sales Cloud Execute anonymous Apex code. Self-contained Naftiko capability covering one Salesforce Sales Cloud business
    surface.'
  tags:
  - Salesforce Sales Cloud
  - Execute Anonymous
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SALES_CLOUD_API_KEY: SALESFORCE_SALES_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: tooling-execute-anonymous
    baseUri: https://{instance}.salesforce.com/services/data/v59.0/tooling
    description: Salesforce Sales Cloud Salesforce Tooling API — Execute Anonymous business capability. Self-contained, no
      shared references.
    resources:
    - name: executeAnonymous
      path: /executeAnonymous
      operations:
      - name: executeanonymousapex
        method: GET
        description: Salesforce Sales Cloud Execute anonymous Apex code
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: anonymousBody
          in: query
          type: string
          description: The Apex code to execute
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SALES_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: tooling-execute-anonymous-rest
    port: 8080
    description: REST adapter for Salesforce Sales Cloud Salesforce Tooling API — Execute Anonymous. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/executeanonymous
      name: executeanonymous
      description: REST surface for executeAnonymous.
      operations:
      - method: GET
        name: executeanonymousapex
        description: Salesforce Sales Cloud Execute anonymous Apex code
        call: tooling-execute-anonymous.executeanonymousapex
        with:
          anonymousBody: rest.anonymousBody
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: tooling-execute-anonymous-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Sales Cloud Salesforce Tooling API — Execute Anonymous. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: salesforce-sales-cloud-execute-anonymous
      description: Salesforce Sales Cloud Execute anonymous Apex code
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tooling-execute-anonymous.executeanonymousapex
      with:
        anonymousBody: tools.anonymousBody
      outputParameters:
      - type: object
        mapping: $.
