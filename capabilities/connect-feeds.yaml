naftiko: 1.0.0-alpha2
info:
  label: Salesforce Sales Cloud Salesforce Connect REST API — Feeds
  description: 'Salesforce Sales Cloud Salesforce Connect REST API — Feeds. 2 operations. Lead operation: Salesforce Sales
    Cloud Get news feed for current user. Self-contained Naftiko capability covering one Salesforce Sales Cloud business surface.'
  tags:
  - Salesforce Sales Cloud
  - Feeds
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SALES_CLOUD_API_KEY: SALESFORCE_SALES_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: connect-feeds
    baseUri: https://{instance}.salesforce.com/services/data/v59.0/connect
    description: Salesforce Sales Cloud Salesforce Connect REST API — Feeds business capability. Self-contained, no shared
      references.
    resources:
    - name: chatter-feeds-news-me-feed-elements
      path: /chatter/feeds/news/me/feed-elements
      operations:
      - name: getnewsfeed
        method: GET
        description: Salesforce Sales Cloud Get news feed for current user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: pageSize
          in: query
          type: integer
          description: Number of items per page (default 25, max 100)
        - name: pageToken
          in: query
          type: string
          description: Token for the next page of results
        - name: sort
          in: query
          type: string
          description: Sort order for feed elements
    - name: chatter-feeds-record-recordId-feed-elements
      path: /chatter/feeds/record/{recordId}/feed-elements
      operations:
      - name: getrecordfeed
        method: GET
        description: Salesforce Sales Cloud Get feed for a specific record
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: recordId
          in: path
          type: string
          description: The ID of the record
          required: true
        - name: pageSize
          in: query
          type: integer
        - name: pageToken
          in: query
          type: string
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SALES_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: connect-feeds-rest
    port: 8080
    description: REST adapter for Salesforce Sales Cloud Salesforce Connect REST API — Feeds. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/chatter/feeds/news/me/feed-elements
      name: chatter-feeds-news-me-feed-elements
      description: REST surface for chatter-feeds-news-me-feed-elements.
      operations:
      - method: GET
        name: getnewsfeed
        description: Salesforce Sales Cloud Get news feed for current user
        call: connect-feeds.getnewsfeed
        with:
          pageSize: rest.pageSize
          pageToken: rest.pageToken
          sort: rest.sort
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/chatter/feeds/record/{recordid}/feed-elements
      name: chatter-feeds-record-recordid-feed-elements
      description: REST surface for chatter-feeds-record-recordId-feed-elements.
      operations:
      - method: GET
        name: getrecordfeed
        description: Salesforce Sales Cloud Get feed for a specific record
        call: connect-feeds.getrecordfeed
        with:
          recordId: rest.recordId
          pageSize: rest.pageSize
          pageToken: rest.pageToken
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connect-feeds-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Sales Cloud Salesforce Connect REST API — Feeds. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: salesforce-sales-cloud-get-news
      description: Salesforce Sales Cloud Get news feed for current user
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: connect-feeds.getnewsfeed
      with:
        pageSize: tools.pageSize
        pageToken: tools.pageToken
        sort: tools.sort
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sales-cloud-get-feed
      description: Salesforce Sales Cloud Get feed for a specific record
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: connect-feeds.getrecordfeed
      with:
        recordId: tools.recordId
        pageSize: tools.pageSize
        pageToken: tools.pageToken
      outputParameters:
      - type: object
        mapping: $.
