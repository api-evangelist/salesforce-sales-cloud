naftiko: 1.0.0-alpha2
info:
  label: Salesforce Sales Cloud Salesforce Connect REST API — Files
  description: 'Salesforce Sales Cloud Salesforce Connect REST API — Files. 1 operations. Lead operation: Salesforce Sales
    Cloud Get files owned by current user. Self-contained Naftiko capability covering one Salesforce Sales Cloud business
    surface.'
  tags:
  - Salesforce Sales Cloud
  - Files
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SALES_CLOUD_API_KEY: SALESFORCE_SALES_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: connect-files
    baseUri: https://{instance}.salesforce.com/services/data/v59.0/connect
    description: Salesforce Sales Cloud Salesforce Connect REST API — Files business capability. Self-contained, no shared
      references.
    resources:
    - name: files-users-me
      path: /files/users/me
      operations:
      - name: getmyfiles
        method: GET
        description: Salesforce Sales Cloud Get files owned by current user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: pageSize
          in: query
          type: integer
        - name: pageToken
          in: query
          type: string
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SALES_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: connect-files-rest
    port: 8080
    description: REST adapter for Salesforce Sales Cloud Salesforce Connect REST API — Files. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/files/users/me
      name: files-users-me
      description: REST surface for files-users-me.
      operations:
      - method: GET
        name: getmyfiles
        description: Salesforce Sales Cloud Get files owned by current user
        call: connect-files.getmyfiles
        with:
          pageSize: rest.pageSize
          pageToken: rest.pageToken
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: connect-files-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Sales Cloud Salesforce Connect REST API — Files. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: salesforce-sales-cloud-get-files
      description: Salesforce Sales Cloud Get files owned by current user
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: connect-files.getmyfiles
      with:
        pageSize: tools.pageSize
        pageToken: tools.pageToken
      outputParameters:
      - type: object
        mapping: $.
