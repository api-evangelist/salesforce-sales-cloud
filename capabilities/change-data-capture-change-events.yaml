naftiko: 1.0.0-alpha2
info:
  label: Salesforce Sales Cloud Salesforce Change Data Capture API — Change Events
  description: 'Salesforce Sales Cloud Salesforce Change Data Capture API — Change Events. 2 operations. Lead operation: Salesforce
    Sales Cloud Describe a change event object. Self-contained Naftiko capability covering one Salesforce Sales Cloud business
    surface.'
  tags:
  - Salesforce Sales Cloud
  - Change Events
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SALES_CLOUD_API_KEY: SALESFORCE_SALES_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: change-data-capture-change-events
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Sales Cloud Salesforce Change Data Capture API — Change Events business capability. Self-contained,
      no shared references.
    resources:
    - name: sobjects-changeEventName
      path: /sobjects/{changeEventName}
      operations:
      - name: describechangeevent
        method: GET
        description: Salesforce Sales Cloud Describe a change event object
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: sobjects-changeEventName-describe
      path: /sobjects/{changeEventName}/describe
      operations:
      - name: describechangeeventfull
        method: GET
        description: Salesforce Sales Cloud Get full change event metadata
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SALES_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: change-data-capture-change-events-rest
    port: 8080
    description: REST adapter for Salesforce Sales Cloud Salesforce Change Data Capture API — Change Events. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/sobjects/{changeeventname}
      name: sobjects-changeeventname
      description: REST surface for sobjects-changeEventName.
      operations:
      - method: GET
        name: describechangeevent
        description: Salesforce Sales Cloud Describe a change event object
        call: change-data-capture-change-events.describechangeevent
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sobjects/{changeeventname}/describe
      name: sobjects-changeeventname-describe
      description: REST surface for sobjects-changeEventName-describe.
      operations:
      - method: GET
        name: describechangeeventfull
        description: Salesforce Sales Cloud Get full change event metadata
        call: change-data-capture-change-events.describechangeeventfull
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: change-data-capture-change-events-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Sales Cloud Salesforce Change Data Capture API — Change Events. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: salesforce-sales-cloud-describe-change
      description: Salesforce Sales Cloud Describe a change event object
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: change-data-capture-change-events.describechangeevent
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sales-cloud-get-full
      description: Salesforce Sales Cloud Get full change event metadata
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: change-data-capture-change-events.describechangeeventfull
      outputParameters:
      - type: object
        mapping: $.
