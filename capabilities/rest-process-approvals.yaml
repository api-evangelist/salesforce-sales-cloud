naftiko: 1.0.0-alpha2
info:
  label: Salesforce Sales Cloud Salesforce REST API — Process Approvals
  description: 'Salesforce Sales Cloud Salesforce REST API — Process Approvals. 2 operations. Lead operation: Salesforce Sales
    Cloud Get pending process approvals. Self-contained Naftiko capability covering one Salesforce Sales Cloud business surface.'
  tags:
  - Salesforce Sales Cloud
  - Process Approvals
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SALES_CLOUD_API_KEY: SALESFORCE_SALES_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-process-approvals
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Sales Cloud Salesforce REST API — Process Approvals business capability. Self-contained, no shared
      references.
    resources:
    - name: process-approvals
      path: /process/approvals
      operations:
      - name: getprocessapprovals
        method: GET
        description: Salesforce Sales Cloud Get pending process approvals
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: submitprocessapproval
        method: POST
        description: Salesforce Sales Cloud Submit a process approval request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SALES_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-process-approvals-rest
    port: 8080
    description: REST adapter for Salesforce Sales Cloud Salesforce REST API — Process Approvals. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/process/approvals
      name: process-approvals
      description: REST surface for process-approvals.
      operations:
      - method: GET
        name: getprocessapprovals
        description: Salesforce Sales Cloud Get pending process approvals
        call: rest-process-approvals.getprocessapprovals
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: submitprocessapproval
        description: Salesforce Sales Cloud Submit a process approval request
        call: rest-process-approvals.submitprocessapproval
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-process-approvals-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Sales Cloud Salesforce REST API — Process Approvals. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: salesforce-sales-cloud-get-pending
      description: Salesforce Sales Cloud Get pending process approvals
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-process-approvals.getprocessapprovals
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sales-cloud-submit-process
      description: Salesforce Sales Cloud Submit a process approval request
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-process-approvals.submitprocessapproval
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
