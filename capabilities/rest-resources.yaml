naftiko: 1.0.0-alpha2
info:
  label: Salesforce Sales Cloud Salesforce REST API — Resources
  description: 'Salesforce Sales Cloud Salesforce REST API — Resources. 1 operations. Lead operation: Salesforce Sales Cloud
    List available REST resources. Self-contained Naftiko capability covering one Salesforce Sales Cloud business surface.'
  tags:
  - Salesforce Sales Cloud
  - Resources
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SALES_CLOUD_API_KEY: SALESFORCE_SALES_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-resources
    baseUri: https://{instance}.salesforce.com/services/data/v59.0
    description: Salesforce Sales Cloud Salesforce REST API — Resources business capability. Self-contained, no shared references.
    resources:
    - name: root
      path: /
      operations:
      - name: listavailableresources
        method: GET
        description: Salesforce Sales Cloud List available REST resources
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SALES_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-resources-rest
    port: 8080
    description: REST adapter for Salesforce Sales Cloud Salesforce REST API — Resources. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1
      name: root
      description: REST surface for root.
      operations:
      - method: GET
        name: listavailableresources
        description: Salesforce Sales Cloud List available REST resources
        call: rest-resources.listavailableresources
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-resources-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Sales Cloud Salesforce REST API — Resources. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: salesforce-sales-cloud-list-available
      description: Salesforce Sales Cloud List available REST resources
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-resources.listavailableresources
      outputParameters:
      - type: object
        mapping: $.
