naftiko: 1.0.0-alpha2
info:
  label: Salesforce Sales Cloud Salesforce Tooling API — Run Tests
  description: 'Salesforce Sales Cloud Salesforce Tooling API — Run Tests. 2 operations. Lead operation: Salesforce Sales
    Cloud Run Apex tests asynchronously. Self-contained Naftiko capability covering one Salesforce Sales Cloud business surface.'
  tags:
  - Salesforce Sales Cloud
  - Run Tests
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESFORCE_SALES_CLOUD_API_KEY: SALESFORCE_SALES_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: tooling-run-tests
    baseUri: https://{instance}.salesforce.com/services/data/v59.0/tooling
    description: Salesforce Sales Cloud Salesforce Tooling API — Run Tests business capability. Self-contained, no shared
      references.
    resources:
    - name: runTestsAsynchronous
      path: /runTestsAsynchronous
      operations:
      - name: runtestsasync
        method: POST
        description: Salesforce Sales Cloud Run Apex tests asynchronously
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: runTestsSynchronous
      path: /runTestsSynchronous
      operations:
      - name: runtestssync
        method: POST
        description: Salesforce Sales Cloud Run Apex tests synchronously
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESFORCE_SALES_CLOUD_API_KEY}}'
  exposes:
  - type: rest
    namespace: tooling-run-tests-rest
    port: 8080
    description: REST adapter for Salesforce Sales Cloud Salesforce Tooling API — Run Tests. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/runtestsasynchronous
      name: runtestsasynchronous
      description: REST surface for runTestsAsynchronous.
      operations:
      - method: POST
        name: runtestsasync
        description: Salesforce Sales Cloud Run Apex tests asynchronously
        call: tooling-run-tests.runtestsasync
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/runtestssynchronous
      name: runtestssynchronous
      description: REST surface for runTestsSynchronous.
      operations:
      - method: POST
        name: runtestssync
        description: Salesforce Sales Cloud Run Apex tests synchronously
        call: tooling-run-tests.runtestssync
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: tooling-run-tests-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesforce Sales Cloud Salesforce Tooling API — Run Tests. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: salesforce-sales-cloud-run-apex
      description: Salesforce Sales Cloud Run Apex tests asynchronously
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: tooling-run-tests.runtestsasync
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesforce-sales-cloud-run-apex-2
      description: Salesforce Sales Cloud Run Apex tests synchronously
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: tooling-run-tests.runtestssync
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
